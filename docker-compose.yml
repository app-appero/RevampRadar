services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: revampradar
      POSTGRES_PASSWORD: revampradar
      POSTGRES_DB: revampradar
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revampradar -d revampradar"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://revampradar:revampradar@db:5432/revampradar
      CORS_ORIGINS: http://localhost:1420,http://localhost:5173,http://127.0.0.1:1420,tauri://localhost,http://tauri.localhost
      SCREENSHOT_DIR: /data/screenshots
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-claude}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-90}
    volumes:
      - ./data/screenshots:/data/screenshots
    shm_size: "1gb"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
